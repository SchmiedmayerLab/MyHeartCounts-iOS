name: Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: |
          The GitHub deployment environment.
        required: true
        default: 'staging'
        type: choice
        options:
          - development
          - staging
          - production
      version:
        description: |
          The semantic version of the app that should be released.
        required: true
        type: string
      buildnumber:
        description: |
          Optional build number for the Stanford build; must be even. The Imperial build always takes the next free odd build number.
        required: false
        type: string
      releasenotes:
        description: |
          Release notes of what changed in this version.
        required: false
        type: string
        default: Bug fixes and performance improvements.
  workflow_call:
    inputs:
      environment:
        description: |
          The GitHub deployment environment.
        required: false
        type: string
        default: staging
      version:
        description: |
          The semantic version of the app that should be released.
        required: true
        type: string
      buildnumber:
        description: |
          Optional build number for the Stanford build; must be even. The Imperial build always takes the next free odd build number.
        required: false
        type: string
      releasenotes:
        description: |
          Release notes of what changed in this version.
        required: false
        type: string
        default: Bug fixes and performance improvements.

concurrency:
  group: deployment
  cancel-in-progress: false

jobs:
  version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.script.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - uses: actions-ecosystem/action-get-latest-tag@v1
        id: get-latest-tag
        with:
          semver_only: true
          initial_version: "4.0.0"
      - id: script
        run: |
          if [[ -z "${{ inputs.version }}" ]]; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "${{ steps.get-latest-tag.outputs.tag }}"

            PATCH=$((PATCH + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"

            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            echo "version: $NEW_VERSION"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "version: ${{ inputs.version }}"
          fi
  test:
    name: Build and Test
    uses: ./.github/workflows/build-and-test.yml
    permissions:
      contents: read
      actions: read
    secrets: inherit
  deploy:
    name: Deploy
    needs: [version, test]
    # TEMPORARY: the actual deployment is paused; the workflow only builds and tests. Remove this line to deploy again.
    if: ${{ false }}
    # TestFlight deployments build, upload, and distribute both study variants;
    # production deployments submit the Stanford build to the App Store (see the `deploy` lane in the Fastfile).
    uses: SchmiedmayerLab/.github/.github/workflows/xcode-deploy.yml@v0.5
    permissions:
      contents: read
    with:
      runs_on_labels: '["macOS", "self-hosted"]'
      xcode_version: 'latest-stable'
      environment: ${{ inputs.environment || 'staging' }}
      injected_secret_file_path: 'MyHeartCounts/Supporting Files/GoogleService-Info.plist'
      setup_signing: true
      command: >-
        fastlane deploy environment:"${{ inputs.environment || 'staging' }}"
        versionname:"${{ needs.version.outputs.version }}" releasenotes:"${{ inputs.releasenotes }}"
        ${{ inputs.buildnumber && format('buildnumber:"{0}"', inputs.buildnumber) || '' }}
        strip_sensorkit_entitlement:false
    secrets:
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      BUILD_SECONDARY_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_SECONDARY_PROVISION_PROFILE_BASE64 }}
      INJECTED_SECRET_FILE_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
