# Replaces the default config of the shared Markdown Links workflow, so it repeats those defaults.
dirs:
  - .
useGitIgnore: true
ignorePatterns:
  - pattern: '^doc:.*$'
  - pattern: '^http://localhost.*$'
  # times out from GitHub-hosted runners, although it loads fine elsewhere
  - pattern: '^https://myheartcounts\.stanford\.edu(/.*)?$'
replacementPatterns:
  - pattern: '(.*)#gh-dark-mode-only'
    replacement: '$1'
  - pattern: '(.*)#gh-light-mode-only'
    replacement: '$1'
